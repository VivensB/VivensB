<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Vivens B">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/><stop offset="1" stop-color="#141C25"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1C2836"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0F14" stop-opacity="1"/>
      <stop offset="0.46" stop-color="#0B0F14" stop-opacity="0.96"/>
      <stop offset="0.78" stop-color="#0B0F14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- three strata: firmware, service, interface -->
  <g>
    <path d="M700 262 L1200 210 L1200 268 L700 320 Z" fill="#16202B"/>
    <path d="M700 196 L1200 144 L1200 202 L700 254 Z" fill="#18242F"/>
    <path d="M700 130 L1200  78 L1200 136 L700 188 Z" fill="#1B2833"/>
  </g>

  <!-- a signal crossing all three -->
  <path d="M726 292 L826 250 L906 268 L986 176 L1066 200 L1146 104"
        fill="none" stroke="#3FB950" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  <g fill="#0B0F14" stroke="#3FB950" stroke-width="2">
    <circle cx="826" cy="250" r="4.2"/><circle cx="986" cy="176" r="4.2"/>
  </g>
  <circle cx="1146" cy="104" r="46" fill="url(#glow)"/>
  <circle cx="1146" cy="104" r="6.5" fill="#3FB950"/>

  <rect width="1200" height="320" fill="url(#veil)"/>

  <text x="72" y="150" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="70" font-weight="700" letter-spacing="-2.4" fill="#F0F6FC">Vivens B</text>
  <rect x="76" y="176" width="54" height="2.5" fill="#3FB950" rx="1.25"/>
  <text x="75" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="18.5" font-weight="500" letter-spacing="0.1" fill="#8B98A5">Full-stack TypeScript · Embedded · Trading systems</text>
</svg>
